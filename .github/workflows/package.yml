# Empaqueta cada addon de addons/ en <Addon>.zip y los publica en la release "latest".
# Descarga sin herramientas: https://github.com/<owner>/<repo>/releases/latest
# Sin acciones de terceros: solo git y gh, que ya vienen en el runner.
name: package

on:
  push:
    branches: [main]
    paths: ["addons/**", ".github/workflows/package.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Descargar el commit
        run: |
          git init -q src
          git -C src fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git -C src checkout -q FETCH_HEAD

      - name: Empaquetar addons
        run: |
          mkdir dist
          cd src/addons
          for d in */; do
            name="${d%/}"
            zip -qr "../../dist/${name}.zip" "${name}" -x '*.bak' '*.tmp'
            echo "  ${name}.zip"
          done
          ls -l ../../dist

      - name: Publicar la release "latest"
        run: |
          short="${GITHUB_SHA::7}"
          notes="Commit ${short} ($(date -u +%Y-%m-%d\ %H:%M) UTC).

          Instalar: descarga el .zip del addon y descomprímelo dentro de
          World of Warcraft\\<_retail_ o _forever_>\\Interface\\AddOns
          (sustituye la carpeta anterior si existe). Luego /reload en el juego."
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create latest dist/*.zip --target "${GITHUB_SHA}" --latest \
            --title "Addons (${short})" --notes "${notes}"
