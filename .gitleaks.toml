title = "Patrones genéricos del proyecto"

# Reglas en docs/README.md, sección "Seguridad, coste y cumplimiento".
# Solo patrones genéricos: los nombres concretos del entorno del usuario viven
# fuera del repo (~/.config/gitleaks/personal.toml o GITLEAKS_PERSONAL_CONFIG).

[extend]
useDefault = true

[[rules]]
id = "ruta-personal-windows"
description = 'Ruta personal de Windows (C:\Users\<nombre>)'
regex = '''(?i)\b[a-z]:[\\/]+users[\\/]+[a-z0-9._-]+'''
keywords = ["users"]
[[rules.allowlists]]
stopwords = ["public", "default"]

# secretGroup es necesario: la lista de permitidos global de gitleaks ignora
# cualquier secreto que empiece por /home/ o /Users/.
[[rules]]
id = "ruta-personal-unix"
description = "Ruta personal de Linux o macOS (/home/<nombre>, /Users/<nombre>)"
regex = '''/(?:home|Users)/([A-Za-z0-9._-]+)'''
secretGroup = 1
keywords = ["/home/", "/users/"]
[[rules.allowlists]]
# "yo": marcador de ejemplo que ya está en el historial (scripts/link.sh, 011233c).
stopwords = ["runner", "shared", "yo"]

[[rules]]
id = "ip-privada"
description = "IP de red local o de Tailscale"
regex = '''\b(?:10\.\d{1,3}|192\.168|172\.(?:1[6-9]|2\d|3[01])|100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7]))\.\d{1,3}\.\d{1,3}\b'''

# Cuenta de Battle.net (Nombre#1234): sale en rutas de WTF y en SavedVariables.
[[rules]]
id = "battletag"
description = "BattleTag (Nombre#1234)"
regex = '''\b[\p{L}][\p{L}\p{N}]{2,11}#\d{4,5}\b'''
